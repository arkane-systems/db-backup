# Example only; not applied by kustomization.yaml. Create the real Secret with
# your own tooling (sealed-secrets, external-secrets, ...) or directly:
#
#   kubectl -n db-backup create secret generic db-backup-credentials \
#     --from-literal=MARIADB_PASSWORD='...' \
#     --from-literal=POSTGRES_PASSWORD='...' \
#     --from-literal=MONGODB_PASSWORD='...' \
#     --from-literal=MQTT_PASSWORD='...'
#
# Each key becomes an environment variable, referenced by a *_env setting in config.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: db-backup-credentials
  namespace: db-backup
type: Opaque
stringData:
  MARIADB_PASSWORD: change-me
  POSTGRES_PASSWORD: change-me
  MONGODB_PASSWORD: change-me
  MQTT_PASSWORD: change-me
